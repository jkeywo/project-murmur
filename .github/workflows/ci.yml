# Fleet CI caller — the workflow itself lives in vellum, pinned to a rev like
# every other vellum dependency; a bump PR moves this rev together with the
# Cargo and pyproject pins. Jobs: pasm validate + scan (gates), fmt / clippy
# -D warnings / tests, Trunk web build, Pages deploy on main pushes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The deploy job inside fleet-ci needs pages + id-token; a called workflow can
# only narrow what the caller grants.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fleet:
    uses: jkeywo/vellum/.github/workflows/fleet-ci.yml@65f65917adb8cad15a782bb1cde61d2448e3b731
    with:
      # murmur-web is Ratzilla and only ever compiles for wasm32, so the lint
      # takes two passes: the host workspace without it, then it alone on its
      # own target.
      rust-targets: wasm32-unknown-unknown
      clippy-command: |
        cargo clippy --workspace --exclude murmur-web --all-targets -- -D warnings
        cargo clippy -p murmur-web --target wasm32-unknown-unknown -- -D warnings
      test-command: cargo test --workspace --exclude murmur-web
      wasm-mode: trunk
      trunk-working-directory: crates/murmur-web
